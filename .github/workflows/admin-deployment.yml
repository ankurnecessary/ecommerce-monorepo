name: Admin:Test, Build, and Deploy

on:
  push:
    branches:
      - main
    paths:
      - "apps/admin/**"
      - "packages/ui/**"
      - "packages/eslint-config/**"
      - "packages/typescript-config/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".npmrc"
      - ".nvmrc"
      - ".github/actions/setup-node-pnpm/**"
      - ".github/workflows/admin-deployment.yml"

jobs:
    
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Run unit tests with coverage
        run: pnpm --filter admin run test:coverage

  build:
    runs-on: ubuntu-latest
    needs: 
      - test

    steps:
      
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Run lint
        run: pnpm --filter admin run lint

      - name: Make build
        run: pnpm --filter admin run build

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to Amplify
        run: aws amplify start-job --app-id ${{ secrets.AWS_ADMIN_APP_ID }} --branch-name main --job-type RELEASE --region ${{ secrets.AWS_REGION }}
