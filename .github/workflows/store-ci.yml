name: Store:Test and build

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/store/**"
      - "packages/eslint-config/**"
      - "packages/typescript-config/**"
      - "packages/ui/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".nvmrc"
      - ".github/actions/setup-node-pnpm/**"
      - ".github/workflows/store-ci.yml"
env:
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
  CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
  NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
  NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
  NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /
  NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /signup-success
jobs:
  validate-html:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Run lint
        run: pnpm --filter store lint

      - name: Make build
        run: pnpm --filter store build

      - name: Start Next.js Server
        id: store-server
        run: pnpm --filter store start
        background: true

      - name: Wait for Server to Start
        run: pnpm --filter store exec wait-on http-get://localhost:3000 --timeout 120000

      - name: Validate HTML
        run: pnpm --filter store validate-html
      
      - name: Stop Next.js server
        cancel: store-server

  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Run tests
        run: pnpm --filter store test:coverage

  build:
    runs-on: ubuntu-latest
    needs:
      - validate-html
      - test

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Run lint
        run: pnpm --filter store lint

      - name: Make build
        run: pnpm --filter store build

      - name: Run lighthouse
        run: |
          pnpm install -g @lhci/cli@0.13.0
          pnpm --filter store lighthouse
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
